<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz Time - Grade 4</title><style>body{font-family:Arial,sans-serif;background:#eef7ff;margin:0;color:#123}.wrap{max-width:760px;margin:auto;padding:24px}.card{background:white;border-radius:20px;padding:28px;box-shadow:0 8px 30px #0001;margin-top:30px}h1{color:#1479c9;text-align:center}.sub{text-align:center;color:#527}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1}.q{font-size:22px;font-weight:700}.opt{display:block;padding:14px;margin:10px 0;border:2px solid #d9e8f5;border-radius:12px;cursor:pointer}.btn{background:#1479c9;color:#fff;border:0;padding:14px 24px;border-radius:12px;font-size:17px;cursor:pointer}.timer{font-weight:bold;color:#d44;text-align:right}.hidden{display:none}.brand{text-align:center;font-weight:bold;color:#1680c9;font-size:18px}</style></head><body><div class="wrap"><div class="card" id="start"><div class="brand">The RooTs in mathematics</div><h1>Quiz Time</h1><p class="sub"><b>Grade 4</b> • Rounding Rules • 10 Questions • 15 Minutes</p><label>Student Name</label><input id="name" style="width:100%;box-sizing:border-box;padding:14px;margin:8px 0 20px;border:2px solid #d9e8f5;border-radius:12px" placeholder="Enter your name"><button class="btn" onclick="startQuiz()">Start Quiz</button></div><div class="card hidden" id="quiz"><div class="timer">Time: <span id="time">15:00</span></div><div id="progress"></div><div id="content"></div><button class="btn" id="next" onclick="nextQ()">Next</button></div><div class="card hidden" id="result"></div></div><script>
const qs=[['Round 47 to the nearest ten.',['40','50','47','60'],'50'],['Round 326 to the nearest hundred.',['300','400','320','330'],'300'],['Round 6.74 to the nearest whole number.',['6','7','6.7','8'],'7'],['Round 1,249 to the nearest hundred.',['1,200','1,300','1,250','1,000'],'1,200'],['Round 8.36 to the nearest tenth.',['8.3','8.4','8','8.5'],'8.4'],['Round 5,650 to the nearest thousand.',['5,000','6,000','5,700','7,000'],'6,000'],['Which number rounds to 70 when rounded to the nearest ten?',['64','65','74','76'],'65'],['Round 93.48 to the nearest whole number.',['93','94','93.5','90'],'93'],['Round 4,785 to the nearest ten.',['4,780','4,790','4,800','4,700'],'4,790'],['Which statement describes the rounding rule correctly?',['If the digit to the right is 5 or more, increase the rounding digit by 1.','If the digit to the right is 5 or more, decrease the rounding digit by 1.','Always increase the rounding digit.','Always keep the rounding digit the same.'],'If the digit to the right is 5 or more, increase the rounding digit by 1.']];let i=0,score=0,answers=[],secs=900,timer;function startQuiz(){if(!document.getElementById('name').value.trim())return alert('Please enter your name.');document.getElementById('start').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQ();timer=setInterval(()=>{secs--;document.getElementById('time').textContent=`${String(Math.floor(secs/60)).padStart(2,'0')}:${String(secs%60).padStart(2,'0')}`;if(secs<=0)finish()},1000)}function showQ(){let q=qs[i];document.getElementById('progress').innerHTML=`<p>Question ${i+1} of ${qs.length}</p>`;document.getElementById('content').innerHTML=`<div class="q">${q[0]}</div>`+q[1].map((x,n)=>`<label class="opt"><input type="radio" name="a" value="${x.replaceAll('"','&quot;')}"> ${String.fromCharCode(65+n)}. ${x}</label>`).join('');document.getElementById('next').textContent=i===qs.length-1?'Finish':'Next'}function nextQ(){let s=document.querySelector('input[name=a]:checked');if(!s)return alert('Please choose an answer.');answers[i]=s.value;if(s.value===qs[i][2])score++;i++;if(i>=qs.length)finish();else showQ()}function finish(){clearInterval(timer);document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.remove('hidden');let pct=score*10;document.getElementById('result').innerHTML=`<div class="brand">The RooTs in mathematics</div><h1>Well Done, ${document.getElementById('name').value}!</h1><p style="text-align:center;font-size:24px"><b>Score: ${score} / ${qs.length}</b><br>${pct}%</p><p style="text-align:center">Correct answers: ${score}<br>Wrong answers: ${qs.length-score}</p><button class="btn" onclick="location.reload()">Retake Quiz</button>`}</script></body></html>
